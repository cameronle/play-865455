<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=5"
    />
    <meta name="theme-color" content="#14263d" />
    <script src="/theme.js?v=firelight-2"></script>
    <script src="/clear-game-data.js?v=clear-1"></script>
    <title>Firelight Garden</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg?v=firelight-2" />
    <link rel="stylesheet" href="/theme.css?v=clear-1" />
    <link rel="stylesheet" href="style.css?v=thin-ui-1" />
  </head>
  <body>
    <main class="page">
      <header class="topbar">
        <a href="/" aria-label="Back to games">← PLAY</a>
        <div class="brand">
          <h1>FIRELIGHT GARDEN</h1>
          <span>KEEP THE LITTLE LIGHTS GLOWING</span>
        </div>
        <button id="pause" type="button">PAUSE</button>
      </header>
      <section class="layout">
        <div class="frame">
          <canvas
            id="game"
            tabindex="0"
            width="480"
            height="640"
            aria-label="Firelight Garden playfield"
          ></canvas>
          <div
            id="overlay"
            class="overlay"
            role="status"
            aria-live="polite"
            aria-atomic="true"
          >
            <div class="firefly-mark" aria-hidden="true">✦</div>
            <b id="title">FIRELIGHT GARDEN</b>
            <span id="hint">TAP START TO RELEASE THE FIREFLY</span>
            <button id="start" type="button">START &amp; GLOW</button>
          </div>
        </div>
        <aside>
          <div class="stat"><span>LIGHTS</span><b id="score">000000</b></div>
          <div class="stat"><span>BEST GLOW</span><b id="high">000000</b></div>
          <div class="stat"><span>GARDEN</span><b id="level">01</b></div>
          <div class="stat"><span>CHANCES</span><b id="lives">♥♥♥</b></div>
          <button class="new" id="new" type="button">NEW NIGHT</button>
          <p>← → MOVE LEAF<br />SPACE RELEASE<br />P PAUSE</p>
        </aside>
        <div class="mobile-actions">
          <button id="mobileLaunch" type="button">START &amp; GLOW</button>
          <button id="mobileNew" class="new" type="button">NEW NIGHT</button>
          <p class="control-hint">DRAG TO MOVE THE LEAF</p>
        </div>
      </section>
      <footer>BREAK THE FLOWERS · KEEP THE FIREFLY IN THE GARDEN</footer>
    </main>
    <script src="game.js?v=firelight-2"></script>
    <button class="theme-toggle" type="button" aria-label="Theme: system">
      AUTO
    </button>
  </body>
</html>
