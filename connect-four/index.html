<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#070b12">
  <script src="/theme.js?v=theme-2"></script>
  <title>Connect Four</title>
  <link rel="stylesheet" href="style.css?v=style-2">
  <link rel="stylesheet" href="/theme.css?v=theme-2">
</head>
<body>
  <main class="page">
    <header class="topbar"><a href="/">← PLAY</a><h1>CONNECT FOUR</h1><button id="newButton" type="button">NEW</button></header>
    <section class="settings">
      <label>DIFFICULTY<select id="difficulty"><option value="easy">EASY</option><option value="medium" selected>MEDIUM</option><option value="hard">HARD</option></select></label>
      <label>FIRST MOVE<select id="firstPlayer"><option value="human">YOU</option><option value="computer">COMPUTER</option></select></label>
      <div class="record"><span>RECORD</span><b><i id="wins">0</i>W · <i id="losses">0</i>L · <i id="draws">0</i>D</b></div>
    </section>
    <section class="game-shell">
      <div class="turn"><span id="turnDot"></span><b id="status">YOUR TURN</b><button id="undoButton" type="button">UNDO</button></div>
      <div class="column-controls" aria-label="Choose a column"><button type="button" data-column="0" aria-label="Drop in column 1">↓</button><button type="button" data-column="1" aria-label="Drop in column 2">↓</button><button type="button" data-column="2" aria-label="Drop in column 3">↓</button><button type="button" data-column="3" aria-label="Drop in column 4">↓</button><button type="button" data-column="4" aria-label="Drop in column 5">↓</button><button type="button" data-column="5" aria-label="Drop in column 6">↓</button><button type="button" data-column="6" aria-label="Drop in column 7">↓</button></div>
      <div id="board" class="board" role="grid" aria-label="Connect Four board"></div>
    </section>
    <section class="legend"><span><i class="human"></i>YOU</span><span><i class="computer"></i>COMPUTER</span><span>CONNECT FOUR TO WIN</span></section>
    <footer>TAP A COLUMN · KEYS 1–7 · U UNDO · N NEW</footer>
  </main>
  <script src="rules.js?v=style-2"></script><script src="game.js?v=style-2"></script>
  <button class="theme-toggle" type="button" aria-label="Theme: system">AUTO</button>
</body>
</html>
