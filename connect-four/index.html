<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#07111f"><title>Connect Four</title><link rel="stylesheet" href="style.css?v=connect-four-1"></head>
<body><main class="page"><header><a href="/">← PLAY</a><h1>CONNECT FOUR</h1><button id="newButton" type="button">NEW</button></header>
<section class="settings"><label>DIFFICULTY<select id="difficulty"><option value="easy">EASY</option><option value="medium" selected>MEDIUM</option><option value="hard">HARD</option></select></label><label>FIRST MOVE<select id="firstPlayer"><option value="human">YOU</option><option value="computer">COMPUTER</option></select></label><div class="record"><span>RECORD</span><b><i id="wins">0</i>–<i id="losses">0</i>–<i id="draws">0</i></b></div></section>
<section class="game"><div class="turn"><span id="turnDot"></span><b id="status">YOUR TURN</b><button id="undoButton" type="button">↶ UNDO</button></div>
<div class="column-controls" aria-label="Choose a column"><button type="button" data-column="0" aria-label="Drop in column 1">▼</button><button type="button" data-column="1" aria-label="Drop in column 2">▼</button><button type="button" data-column="2" aria-label="Drop in column 3">▼</button><button type="button" data-column="3" aria-label="Drop in column 4">▼</button><button type="button" data-column="4" aria-label="Drop in column 5">▼</button><button type="button" data-column="5" aria-label="Drop in column 6">▼</button><button type="button" data-column="6" aria-label="Drop in column 7">▼</button></div>
<div id="board" class="board" role="grid" aria-label="Connect Four board"></div></section>
<section class="legend"><span><i class="human"></i>YOU</span><span><i class="computer"></i>COMPUTER</span><span>CONNECT FOUR TO WIN</span></section><footer>TAP A COLUMN · KEYS 1–7 · U UNDO · N NEW</footer></main><script src="rules.js?v=connect-four-1"></script><script src="game.js?v=connect-four-1"></script></body></html>
