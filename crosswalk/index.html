<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#070b12">
  <title>Night Crossing</title>
  <link rel="stylesheet" href="style.css?v=crosswalk-1">
</head>
<body>
  <main class="page">
    <header><a href="/">← PLAY</a><h1>NIGHT CROSSING</h1><button id="pauseButton" type="button">PAUSE</button></header>
    <section class="hud"><div><span>SCORE</span><b id="score">000000</b></div><div><span>LEVEL</span><b id="level">01 / 08</b></div><div><span>LIVES</span><b id="lives">♥ ♥ ♥</b></div></section>
    <div class="frame">
      <canvas id="game" width="600" height="720" aria-label="Night Crossing traffic game"></canvas>
      <div id="overlay" class="overlay"><b id="overlayTitle">NIGHT CROSSING</b><span id="overlayText">REACH THE LIGHTED EXIT</span><button id="startButton" type="button">START CROSSING</button></div>
    </div>
    <section class="dpad" aria-label="Directional touch controls">
      <button data-dir="up" type="button" aria-label="Move up">▲</button>
      <button data-dir="left" type="button" aria-label="Move left">◀</button>
      <button data-dir="down" type="button" aria-label="Move down">▼</button>
      <button data-dir="right" type="button" aria-label="Move right">▶</button>
    </section>
    <footer>ARROW KEYS / WASD · SWIPE OR TAP TO MOVE · P PAUSE</footer>
  </main>
  <script src="game.js?v=crosswalk-1"></script>
</body>
</html>
