<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#070b12">
  <script src="/theme.js?v=runner-2"></script>
  <title>Endless Runner</title>
  <link rel="stylesheet" href="/theme.css?v=runner-2">
  <link rel="stylesheet" href="style.css?v=runner-2">
</head>
<body>
  <main class="page">
    <header class="topbar">
      <a href="/">← PLAY</a>
      <h1>ENDLESS RUNNER</h1>
      <button id="pauseButton" type="button">PAUSE</button>
    </header>
    <section class="hud">
      <div><span>DISTANCE</span><b id="distance">00000m</b></div>
      <div><span>BEST</span><b id="best">00000m</b></div>
      <div><span>SPEED</span><b id="speed">1.00×</b></div>
    </section>
    <div class="screen">
      <canvas id="game" width="800" height="450" aria-label="Endless Runner playfield"></canvas>
      <div id="overlay" class="overlay">
        <b id="message">ENDLESS RUNNER</b>
        <span id="detail">JUMP · CLEAR THE GAPS · KEEP MOVING</span>
        <button id="startButton" type="button">START RUN</button>
      </div>
    </div>
    <section class="controls" aria-label="Runner controls">
      <button id="dropButton" type="button">▼ FAST FALL</button>
      <button id="jumpButton" type="button">▲ HOLD TO JUMP</button>
    </section>
    <section class="legend">
      <span>SHORT TAP: LOW JUMP</span>
      <span>HOLD: HIGH JUMP</span>
      <span>DOWN: FAST FALL</span>
    </section>
    <footer>SPACE / TAP JUMP · DOWN / SWIPE DOWN FAST FALL · P PAUSE</footer>
  </main>
  <script src="game.js?v=runner-2"></script>
  <button class="theme-toggle" type="button" aria-label="Theme: system">AUTO</button>
</body>
</html>
