<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#fffaf0">
  <script src="/theme.js?v=moon-bunny-1"></script>
  <script src="/clear-game-data.js?v=clear-1"></script>
  <title>Moon Bunny</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=moon-bunny-1">
  <link rel="stylesheet" href="style.css?v=moon-bunny-1">
  <link rel="stylesheet" href="/theme.css?v=clear-1">
</head>
<body>
  <main class="page">
    <header class="topbar"><a href="/" aria-label="Back to games">← PLAY</a><div class="brand"><h1>MOON BUNNY</h1><span>LAND SOFTLY. BRING HOME THE MOON FLAG.</span></div><button id="pauseButton" type="button">PAUSE</button></header>
    <section class="hud" aria-label="Mission status"><div><span>SCORE</span><b id="score">00000</b></div><div><span>BEST</span><b id="best">00000</b></div><div><span>SECTOR</span><b id="level">1</b></div><div><span>FUEL</span><b id="fuel">100</b></div></section>
    <div class="screen"><canvas id="game" width="800" height="600" aria-label="Moon Bunny landing game"></canvas><div id="overlay" class="overlay"><div class="overlay-spark" aria-hidden="true">✦</div><b id="message">MOON BUNNY</b><span id="detail">LAND SOFTLY ON THE LIT MOON PLATFORM</span><button id="startButton" type="button">START MISSION</button></div></div>
    <section class="telemetry"><span>V-SPEED <b id="vertical">0.0</b></span><span>H-SPEED <b id="horizontal">0.0</b></span><span>ANGLE <b id="angle">0°</b></span></section>
    <section class="controls" aria-label="Flight controls"><button id="leftButton" type="button" aria-label="Rotate left">↶<span>LEFT</span></button><button id="thrustButton" type="button" aria-label="Thrust">▲<span>THRUST</span></button><button id="rightButton" type="button" aria-label="Rotate right">↷<span>RIGHT</span></button></section>
    <div class="tips"><span>KEEP THE BUNNY LEVEL</span><span>SAVE SOME CARROT FUEL</span><span>TOUCH AND HOLD TO FLY</span></div>
    <footer>ARROWS / A D ROTATE · SPACE / W THRUST · P PAUSE · R RESTART</footer>
  </main>
  <button class="theme-toggle" type="button" aria-label="Theme: system">AUTO</button>
  <script src="game.js?v=moon-bunny-1"></script>
</body>
</html>
