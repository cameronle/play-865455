<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#faf8ef"><title>Gomoku</title><link rel="stylesheet" href="style.css"></head>
<body><main class="page"><header><a href="/">← PLAY</a><h1>GOMOKU</h1><button id="newGame" type="button">NEW GAME</button></header><section class="layout"><div class="board-wrap"><canvas id="board" width="600" height="600" aria-label="Gomoku board"></canvas><div id="message" class="message"><b id="title">GOMOKU</b><span id="hint">YOU PLAY BLACK · CLICK TO START</span><button id="start" type="button">START</button></div></div><aside><div class="stat"><span>STATUS</span><b id="status">READY</b></div><div class="stat"><span>MODE</span><select id="difficulty"><option value="easy">EASY</option><option value="normal" selected>NORMAL</option><option value="hard">HARD</option></select></div><div class="stat"><span>YOU / AI</span><b>● / ○</b></div><div class="stat"><span>RECORD</span><b id="record">0 - 0</b></div><button id="undo" class="secondary" type="button">UNDO MOVE</button><p>BLACK PLAYS FIRST<br>FIVE IN A ROW WINS<br>CLICK / TAP TO PLACE</p></aside></section><footer>CLASSIC RULES · HUMAN VS COMPUTER</footer></main><script src="game.js"></script></body></html>
