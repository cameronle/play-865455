<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#070b12">
  <script src="/theme.js?v=theme-2"></script>
  <title>Gomoku</title>
  <link rel="stylesheet" href="app.css?v=style-2">
  <link rel="stylesheet" href="/theme.css?v=theme-2">
</head>
<body>
  <main class="page">
    <header class="topbar"><a href="/">← PLAY</a><h1>GOMOKU</h1><button id="restart" type="button">NEW GAME</button></header>
    <section class="settings">
      <label>DIFFICULTY<select id="level"><option value="easy">EASY</option><option value="normal" selected>NORMAL</option><option value="hard">HARD</option></select></label>
      <div><span>STATUS</span><b id="statusText">PRESS START</b></div>
      <div class="record"><span>RECORD</span><b><i id="winCount">0</i>W · <i id="lossCount">0</i>L · <i id="drawCount">0</i>D</b></div>
    </section>
    <section class="game-shell">
      <div class="turn"><i id="turnStone" class="black"></i><span>YOU PLAY BLACK</span><button id="undo" type="button" disabled>UNDO</button></div>
      <div class="board-box">
        <canvas id="board" width="750" height="750" aria-label="15 by 15 Gomoku board"></canvas>
        <div id="curtain" class="curtain">
          <b id="curtainTitle">BLACK MOVES FIRST</b>
          <span id="curtainText">Connect five stones before the computer.</span>
          <button id="start" type="button">START</button>
        </div>
      </div>
    </section>
    <footer>TAP AN INTERSECTION · CONNECT FIVE · RED DOT MARKS THE LAST MOVE</footer>
  </main>
  <script src="rules.js?v=style-2"></script>
  <script src="app.js?v=style-2"></script>
  <button class="theme-toggle" type="button" aria-label="Theme: system">AUTO</button>
</body>
</html>
