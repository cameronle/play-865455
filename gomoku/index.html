<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#17120d">
  <title>五子棋 · Gomoku</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <header class="topbar">
      <a href="/" class="back">← PLAY</a>
      <div><span class="eyebrow">FIVE IN A ROW</span><h1>五子棋</h1></div>
      <button id="newGame" type="button">重新开局</button>
    </header>

    <section class="game-shell">
      <div class="board-column">
        <div class="turn-card">
          <span id="turnDot" class="stone black"></span>
          <div><small>当前状态</small><strong id="status">准备开始</strong></div>
        </div>
        <div class="board-frame">
          <canvas id="board" width="720" height="720" aria-label="15乘15五子棋棋盘"></canvas>
          <div id="overlay" class="overlay">
            <div class="seal">五</div>
            <h2 id="overlayTitle">执黑先行</h2>
            <p id="overlayText">你执黑棋，与电脑对弈。横、竖或斜线率先连成五子即胜。</p>
            <button id="start" type="button">开始对局</button>
          </div>
        </div>
        <p class="mobile-tip">点击棋盘交叉点落子</p>
      </div>

      <aside class="panel">
        <section><span class="label">对局</span><div class="versus"><div><i class="stone black"></i><b>你</b><small>黑棋</small></div><em>VS</em><div><i class="stone white"></i><b>电脑</b><small>白棋</small></div></div></section>
        <section><label class="label" for="difficulty">难度</label><select id="difficulty"><option value="easy">轻松</option><option value="normal" selected>标准</option><option value="hard">困难</option></select></section>
        <section><span class="label">战绩</span><div class="record"><div><b id="wins">0</b><small>胜</small></div><div><b id="losses">0</b><small>负</small></div><div><b id="draws">0</b><small>和</small></div></div></section>
        <button id="undo" class="secondary" type="button">悔棋一步</button>
        <ul><li>黑棋先手</li><li>连成五子即胜</li><li>支持鼠标与手机触控</li></ul>
      </aside>
    </section>
  </main>
  <script src="engine.js"></script>
  <script src="game.js"></script>
</body>
</html>
