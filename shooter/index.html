<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#070b12" />
    <script src="/theme.js?v=shooter-3"></script>
    <script src="/clear-game-data.js?v=clear-1"></script>
    <title>Sky Patrol</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="stylesheet" href="/theme.css?v=clear-1" />
    <link rel="stylesheet" href="style.css?v=thin-ui-1" />
  </head>
  <body>
    <main class="page">
      <header class="topbar">
        <a href="/">← PLAY</a>
        <h1>SKY PATROL</h1>
        <div class="header-actions">
          <button
            class="sound"
            id="soundButton"
            aria-label="Toggle sound"
            type="button"
          >
            SOUND
          </button>
        </div>
      </header>

      <p class="sr-only" role="status" id="flightStatus" aria-live="polite"></p>
      <section class="game-wrap" aria-label="Sky Patrol game">
        <div class="hud">
          <div><span>SCORE</span><b id="score">000000</b></div>
          <div><span>LEVEL</span><b id="level">01</b></div>
          <div><span>LIVES</span><b id="lives">♥♥♥</b></div>
        </div>
        <div class="screen-frame">
          <canvas
            id="game"
            width="480"
            height="648"
            aria-label="Sky Patrol flight area. Drag or use direction controls to move; weapons fire automatically."
          ></canvas>
          <div class="overlay" id="overlay">
            <div class="intro">
              <p class="eyebrow">A SMALL ARCADE GAME</p>
              <h1>SKY<br /><em>PATROL</em></h1>
              <p class="hint">
                Drag to move / Arrows / WASD<br />AUTO-FIRE · Stop enemies
                reaching the bottom
              </p>
              <button class="start" id="startButton" type="button">
                START GAME
              </button>
              <p class="best">BEST <strong id="best">000000</strong></p>
            </div>
          </div>
        </div>
        <div class="mobile-controls" aria-label="Touch controls">
          <button id="leftButton" aria-label="Move left" type="button">
            ←
          </button>
          <button id="upButton" aria-label="Move up" type="button">↑</button>
          <button id="rightButton" aria-label="Move right" type="button">
            →
          </button>
          <button id="downButton" aria-label="Move down" type="button">
            ↓
          </button>
          <button
            id="mobilePauseButton"
            aria-label="Pause or resume"
            type="button"
          >
            PAUSE
          </button>
        </div>
      </section>

      <footer>
        <span class="keyboard-help"
          >ARROWS / WASD TO MOVE · AUTO-FIRE · P PAUSE · M MUTE</span
        ><span class="touch-help">DRAG OR HOLD ARROWS · AUTO-FIRE</span>
      </footer>
    </main>
    <script src="game.js?v=shooter-3"></script>
    <button class="theme-toggle" type="button" aria-label="Theme: system">
      AUTO
    </button>
  </body>
</html>
