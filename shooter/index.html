<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#070b12" />
    <script src="/theme.js?v=shooter-3"></script>
    <script src="/clear-game-data.js?v=combat-v4-1"></script>
    <title>星空巡航 · Sky Patrol</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="stylesheet" href="/theme.css?v=clear-1" />
    <link rel="stylesheet" href="style.css?v=auto-stage-1" />
  </head>
  <body>
    <main class="page">
      <header class="topbar">
        <a href="/">← PLAY</a>
        <h1 id="gameTitle">SKY PATROL</h1>
        <div class="header-actions">
          <button
            class="sound"
            id="soundButton"
            aria-label="Toggle sound"
            type="button"
          >
            SOUND
          </button>
        </div>
      </header>
      <p class="sr-only" role="status" id="flightStatus" aria-live="polite"></p>
      <section id="gameSection" class="game-wrap" aria-label="Sky Patrol game">
        <div class="hud">
          <div><span id="scoreLabel">SCORE</span><b id="score">000000</b></div>
          <div>
            <span id="stageLabel">STAGE / WAVE</span><b id="level">01 / 1</b>
          </div>
          <div><span id="livesLabel">LIVES</span><b id="lives">♥♥♥</b></div>
        </div>
        <div class="screen-frame">
          <div class="boss-hud" id="bossHud" hidden>
            <div><span id="bossName"></span><span id="bossPhase"></span></div>
            <progress
              id="bossHealth"
              max="100"
              value="100"
              aria-label="Boss health"
            ></progress>
            <p id="bossDetails"></p>
          </div>
          <canvas
            id="game"
            width="480"
            height="648"
            aria-label="Sky Patrol flight area. Drag or use direction controls to move; weapons fire automatically."
          ></canvas>
          <div class="overlay" id="overlay">
            <div class="intro">
              <p class="eyebrow" id="eyebrow">15 STAGES · A BOSS EACH STAGE</p>
              <h1 id="overlayTitle">SKY PATROL</h1>
              <p class="hint" id="hint">
                Drag to move / Arrows / WASD<br />AUTO-FIRE · Space pulse
              </p>
              <div
                class="mode-select"
                id="modeSelect"
                role="group"
                aria-label="Difficulty"
              >
                <button id="normalButton" type="button" aria-pressed="true">
                  NORMAL</button
                ><button
                  id="challengeButton"
                  type="button"
                  aria-pressed="false"
                >
                  CHALLENGE
                </button>
              </div>
              <div class="supply-select" id="supplySelect" role="group" aria-label="Chapter supply" hidden>
                <button id="supplyLifeButton" type="button">LIFE +1</button>
                <button id="supplyPulseButton" type="button">PULSE +1</button>
              </div>
              <button class="start" id="startButton" type="button">
                START GAME
              </button>
              <p class="best">
                <span id="bestLabel">BEST</span>
                <strong id="best">000000</strong>
              </p>
              <p class="record" id="record"></p>
              <p class="legacy" id="legacyBest"></p>
            </div>
          </div>
        </div>
        <div id="touchControls" class="mobile-controls" aria-label="Touch controls">
          <button id="leftButton" aria-label="Move left" type="button">←</button
          ><button id="upButton" aria-label="Move up" type="button">↑</button
          ><button id="rightButton" aria-label="Move right" type="button">
            →</button
          ><button id="downButton" aria-label="Move down" type="button">
            ↓</button
          ><button
            id="mobilePauseButton"
            aria-label="Pause or resume"
            type="button"
          >
            PAUSE</button
          ><button
            id="pulseButton"
            aria-label="Release one pulse"
            type="button"
          >
            PULSE 2
          </button>
        </div>
        <p class="combat-hint" id="combatHint"></p>
      </section>
      <footer>
        <span class="keyboard-help" id="keyboardHelp"
          >ARROWS / WASD · AUTO-FIRE · SPACE PULSE · P PAUSE · M MUTE</span
        ><span class="touch-help" id="touchHelp"
          >DRAG OR HOLD ARROWS · AUTO-FIRE</span
        >
      </footer>
    </main>
    <script src="content.js?v=combat-v4-1"></script>
    <script src="bosses.js?v=combat-v4-1"></script>
    <script src="enemies.js?v=combat-v4-1"></script>
    <script src="director.js?v=combat-v4-1"></script>
    <script src="rules.js?v=auto-stage-1"></script>
    <script src="locale.js?v=auto-stage-1"></script>
    <script src="renderer.js?v=auto-stage-1"></script>
    <script src="game.js?v=auto-stage-1"></script>
    <button class="theme-toggle" type="button" aria-label="Theme: system">
      AUTO
    </button>
  </body>
</html>
