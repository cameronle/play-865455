<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#fff5df">
  <script src="/theme.js?v=mushroom-trail-1"></script>
  <script src="/clear-game-data.js?v=clear-1"></script>
  <title>Mushroom Trail</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=mushroom-trail-1">
  <link rel="stylesheet" href="/theme.css?v=clear-1">
  <link rel="stylesheet" href="style.css?v=mushroom-trail-1">
</head>
<body>
  <main class="page">
    <header class="topbar">
      <a class="back-link" href="/" aria-label="Back to games">← PLAY</a>
      <div class="brand">
        <h1>MUSHROOM TRAIL</h1>
        <span>A HAND-DRAWN PLATFORM ADVENTURE</span>
      </div>
      <button id="pauseButton" type="button">PAUSE</button>
    </header>

    <section class="hud" aria-label="Game status">
      <div class="stat stat-world"><span>WORLD</span><b id="world">1-1</b></div>
      <div class="stat stat-coins"><span>COINS</span><b id="coins">00</b></div>
      <div class="stat stat-lives"><span>LIVES</span><b id="lives">♥♥♥</b></div>
      <div class="stat stat-score"><span>SCORE</span><b id="score">000000</b></div>
    </section>

    <div class="screen">
      <canvas id="game" width="960" height="540" aria-label="Mushroom Trail platform adventure"></canvas>
      <div id="overlay" class="overlay">
        <div class="overlay-mark" aria-hidden="true">✦</div>
        <b id="message">MUSHROOM TRAIL</b>
        <span id="detail">RUN · JUMP · STOMP · FIND THE BEACON</span>
        <button id="startButton" type="button">START ADVENTURE</button>
      </div>
    </div>

    <section class="controls" aria-label="Movement controls">
      <button id="leftButton" type="button" aria-label="Move left">←</button>
      <button id="jumpButton" type="button" aria-label="Jump">JUMP</button>
      <button id="rightButton" type="button" aria-label="Move right">→</button>
    </section>
    <div class="tips" aria-label="How to play">
      <span>COLLECT COINS</span>
      <span>STOMP BOUNCE BUGS</span>
      <span>REACH THE SUN BEACON</span>
    </div>
    <footer>ARROWS / A D MOVE · SPACE / W / ↑ JUMP · P PAUSE</footer>
  </main>
  <button class="theme-toggle" type="button" aria-label="Theme: system">AUTO</button>
  <script src="game.js?v=mushroom-trail-1"></script>
</body>
</html>
