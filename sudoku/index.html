<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#faf8ef"><script src="/theme.js?v=theme-1"></script><title>Sudoku</title><link rel="stylesheet" href="style.css?v=theme-1"><link rel="stylesheet" href="/theme.css?v=clear-1"></head><script src="/clear-game-data.js?v=clear-1"></script>
<body><main class="page"><header><a href="/">← PLAY</a><h1>SUDOKU</h1><button id="newButton" type="button">NEW</button></header>
<section class="toolbar"><label>DIFFICULTY <select id="difficulty"><option value="easy">EASY</option><option value="medium" selected>MEDIUM</option><option value="hard">HARD</option></select></label><div>TIME <b id="timer">00:00</b></div><div>MISTAKES <b id="mistakes">0 / 3</b></div><div>BEST <b id="best">--:--</b></div></section>
<section class="game-layout"><div class="board-wrap"><div id="board" class="board" role="grid" aria-label="Sudoku board"></div><div id="overlay" class="overlay"><b id="overlayTitle">SUDOKU</b><span id="overlayText">SELECT A CELL AND PLACE A NUMBER</span><button id="startButton" type="button">START</button></div></div>
<aside><div class="actions"><button id="undoButton" type="button">↶<span>UNDO</span></button><button id="eraseButton" type="button">⌫<span>ERASE</span></button><button id="notesButton" type="button">✎<span>NOTES</span></button><button id="hintButton" type="button">?<span>HINT</span></button></div><p><b>NOTES</b> adds candidates.<br><b>HINT</b> fills one cell.<br>Three mistakes end the game.</p></aside></section>
<div class="number-pad" aria-label="Number pad"><button data-number="1">1</button><button data-number="2">2</button><button data-number="3">3</button><button data-number="4">4</button><button data-number="5">5</button><button data-number="6">6</button><button data-number="7">7</button><button data-number="8">8</button><button data-number="9">9</button></div>
<footer>KEYS 1–9 · N NOTES · BACKSPACE ERASE · ARROWS MOVE</footer></main><script src="rules.js?v=sudoku-1"></script><script src="game.js?v=sudoku-1"></script><button class="theme-toggle" type="button" aria-label="Theme: system">AUTO</button></body></html>
