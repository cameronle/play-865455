<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#fffaf0">
  <script src="/theme.js?v=cat-ghosts-1"></script>
  <script src="/clear-game-data.js?v=clear-1"></script>
  <title>Cat &amp; Ghosts</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=cat-ghosts-1">
  <link rel="stylesheet" href="style.css?v=cat-ghosts-audit-2">
  <link rel="stylesheet" href="/theme.css?v=clear-1">
</head>
<body>
  <main class="page">
    <header class="topbar">
      <a href="/" aria-label="Back to games">← PLAY</a>
      <div class="brand"><h1>CAT &amp; GHOSTS</h1><span>FIND THE FISH. DODGE THE SHEETS.</span></div>
      <div class="top-actions"><button id="new" class="new" type="button" aria-label="Start a new hunt">NEW</button><button id="pause" type="button" disabled aria-pressed="false">PAUSE</button></div>
    </header>
    <section class="layout" aria-label="Maze game">
      <div class="frame">
        <canvas id="game" width="480" height="480" tabindex="0" aria-label="Cat and Ghosts maze board" aria-describedby="move-help"></canvas>
        <div id="overlay" class="overlay" role="region" aria-label="Game menu"><div class="overlay-spark" aria-hidden="true">✦</div><b id="title" aria-live="polite">CAT &amp; GHOSTS</b><span id="hint">HELP THE CAT FIND EVERY FISH TREAT</span><button id="start" type="button">START HUNTING</button></div>
      </div>
      <aside>
        <div class="stats">
          <div class="stat"><span>SCORE</span><b id="score">000000</b></div>
          <div class="stat"><span>BEST</span><b id="high">000000</b></div>
          <div class="stat"><span>ROOM</span><b id="level">01</b></div>
          <div class="stat"><span>LIVES</span><b id="lives">♥♥♥</b></div>
        </div>
        <p class="fish-status"><b id="remaining">---</b> FISH LEFT</p>
        <p id="move-help" class="touch-help">SWIPE OR TAP TO MOVE</p>
        <p class="desktop-help"><b>← → ↑ ↓ / WASD</b> MOVE<br><b>P</b> PAUSE<br><b>FIND ALL FISH</b></p>
        <div class="mobile-controls" aria-label="Touch controls">
          <button data-dir="left" type="button" aria-label="Move left">←</button><button data-dir="up" type="button" aria-label="Move up">↑</button><button data-dir="down" type="button" aria-label="Move down">↓</button><button data-dir="right" type="button" aria-label="Move right">→</button>
        </div>
        <div class="utility-dock"><button class="theme-toggle" type="button" aria-label="Theme: system">AUTO</button></div>
      </aside>
    </section>
    <footer>FIND THE FISH · OUTRUN THE GHOSTS · WALLS ARE REAL</footer>
  </main>
  <script src="logic.js?v=cat-ghosts-1"></script>
  <script src="game.js?v=cat-ghosts-audit-2"></script>
</body>
</html>
