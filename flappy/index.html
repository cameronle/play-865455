<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#070b12">
  <script src="/theme.js?v=flappy-1"></script>
  <title>Flappy Wings</title>
  <link rel="stylesheet" href="/theme.css?v=flappy-1">
  <link rel="stylesheet" href="style.css?v=flappy-1">
</head>
<body>
  <main class="page">
    <header class="topbar">
      <a href="/">← PLAY</a>
      <h1>FLAPPY WINGS</h1>
      <div class="header-actions">
        <button id="pauseButton" type="button">PAUSE</button>
      </div>
    </header>
    <section class="toolbar">
      <div class="stat-pill"><span class="stat-label">SCORE</span><b id="scoreStat">0</b></div>
      <div class="stat-pill"><span class="stat-label">BEST</span><b id="bestStat">0</b></div>
    </section>
    <div class="frame">
      <canvas id="game" width="400" height="600" aria-label="Flappy Wings arcade flying game"></canvas>
      <div id="overlay" class="overlay">
        <b id="overlayTitle">FLAPPY WINGS</b>
        <span id="overlayText">TAP OR PRESS SPACE TO FLAP</span>
        <button id="startButton" type="button">START FLYING</button>
      </div>
    </div>
    <footer>TAP ANYWHERE OR PRESS SPACE TO FLY · FLY THROUGH PIPE GAPS</footer>
  </main>

  <script src="rules.js?v=flappy-1"></script>
  <script src="game.js?v=flappy-1"></script>
  <button class="theme-toggle" type="button" aria-label="Theme: system">AUTO</button>
</body>
</html>
