<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#070b12">
  <script src="/theme.js?v=hopper-2"></script><script src="/clear-game-data.js?v=clear-1"></script>
  <title>Sky Hopper</title>
  <link rel="stylesheet" href="/theme.css?v=clear-1">
  <link rel="stylesheet" href="style.css?v=hopper-2">
</head>
<body>
  <main class="page">
    <header class="topbar">
      <a href="/">← PLAY</a>
      <h1>SKY HOPPER</h1>
      <button id="pauseButton" type="button">PAUSE</button>
    </header>
    <section class="hud">
      <div><span>SCORE</span><b id="score">000000</b></div>
      <div><span>BEST</span><b id="best">000000</b></div>
      <div><span>HEIGHT</span><b id="height">0000m</b></div>
    </section>
    <div class="screen">
      <canvas id="game" width="480" height="720" aria-label="Sky Hopper playfield"></canvas>
      <div id="overlay" class="overlay">
        <b id="message">SKY HOPPER</b>
        <span id="detail">BOUNCE UP · DO NOT FALL</span>
        <button id="startButton" type="button">START</button>
      </div>
    </div>
    <section class="controls" aria-label="Movement controls">
      <button id="leftButton" type="button">← LEFT</button>
      <button id="rightButton" type="button">RIGHT →</button>
    </section>
    <section class="legend">
      <span><i class="normal"></i>NORMAL</span>
      <span><i class="moving"></i>MOVING</span>
      <span><i class="breaking"></i>BREAKING</span>
      <span><i class="spring"></i>SPRING</span>
    </section>
    <footer>ARROWS / A D MOVE · TOUCH EITHER SIDE · P PAUSE</footer>
  </main>
  <script src="game.js?v=hopper-2"></script>
  <button class="theme-toggle" type="button" aria-label="Theme: system">AUTO</button>
</body>
</html>
