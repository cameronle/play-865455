<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#faf8ef">
  <title>2048</title>
  <link rel="stylesheet" href="style.css?v=bffa164">
</head>
<body>
  <main class="page">
    <header class="topbar">
      <a href="/" class="back">← PLAY</a>
      <h1>2048</h1>
      <button id="newGame" class="quiet" type="button">NEW GAME</button>
    </header>
    <section class="scorebar">
      <div class="score"><span>SCORE</span><strong id="score">000000</strong></div>
      <div class="score"><span>BEST</span><strong id="best">000000</strong></div>
    </section>
    <section class="board-wrap">
      <div id="board" class="board" aria-label="2048 board"></div>
      <div id="overlay" class="overlay hidden"><strong id="overlayTitle">GAME OVER</strong><button id="tryAgain" type="button">TRY AGAIN</button></div>
    </section>
    <div class="controls" aria-label="Touch controls"><span></span><button data-dir="up" aria-label="Move up">↑</button><span></span><button data-dir="left" aria-label="Move left">←</button><button data-dir="down" aria-label="Move down">↓</button><button data-dir="right" aria-label="Move right">→</button></div>
    <footer>JOIN THE TILES · REACH 2048</footer>
  </main>
  <script src="game.js?v=bffa164"></script>
</body>
</html>
